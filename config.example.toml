# NEXUS configuration — copy to ~/.config/nexus/config.toml and adapt.
# Every key is optional: missing keys use the default shown here.
# Secrets (tokens, passwords) never go here: run scripts/setup-secrets.sh (GNOME keyring).

# GNOME shortcut that toggles the dashboard, created once on first start
# (Above_Tab = the key above Tab: ² on AZERTY, ` on QWERTY). After that, change it in
# Settings → Keyboard → Custom Shortcuts. "" = never touch keyboard settings.
shortcut = "<Super>Above_Tab"

[appearance]
# Wayland cannot blur what is behind a window. When true, NEXUS draws your current
# GNOME wallpaper, blurred and darkened. Set false for a truly transparent window
# (e.g. with the Blur My Shell extension, "Applications" option, for real blur).
wallpaper_blur = true

# Image shown faintly in the centre, behind the cards (jpg, png, svg). Leave missing for none.
logo = "~/.config/nexus/logo.jpg"

# ---------------------------------------------------------------------------
# App launcher (3×3 grid, filled row by row). `desktop` = .desktop file name
# without extension, searched in ~/.local/share/applications, XDG_DATA_DIRS
# and the Flatpak exports. Tip: `ls /usr/share/applications`.
# Missing apps are shown greyed out and logged. No [[apps]] at all = 9 stock
# Fedora apps; `apps = []` = empty grid.
[[apps]]
name = "Firefox"
desktop = "org.mozilla.firefox"

[[apps]]
name = "Files"
desktop = "org.gnome.Nautilus"

[[apps]]
name = "Terminal"
desktop = "org.gnome.Ptyxis"

# ---------------------------------------------------------------------------
# Command buttons: each opens a new WezTerm window running `command` in your
# interactive shell ($SHELL -ic, so aliases work), then stays on the shell.
[[commands]]
label = "Update system"
subtitle = "dnf upgrade"
command = "sudo dnf upgrade"

[[commands]]
label = "Backup to USB"
subtitle = "Key detected · rsync"
subtitle_unavailable = "Key not plugged in"
# Enabled (green dot) only while this path exists; mount events update it live.
requires_path = "/run/media/YOUR_USER/YOUR_KEY"
command = "rsync -av ~/Documents/ /run/media/YOUR_USER/YOUR_KEY/Documents/"
cwd = "~"

# ---------------------------------------------------------------------------
# Weather (Open-Meteo, free, no key). Remove the section to hide it.
[weather]
latitude = 45.764
longitude = 4.835
place = "Lyon"

# ---------------------------------------------------------------------------
# Next departures. Remove the section to hide it.
# provider "tcl" = Lyon TCL real-time data (data.grandlyon.com, free account;
# credentials go in the keyring as grandlyon_user / grandlyon_password, and the
# account must have requested access to the "Prochains passages" dataset).
# Stop ids: https://data.grandlyon.com/fr/datapusher/ws/rdata/tcl_sytral.tclarret/all.json
# (one id per direction). Another network = a new provider in src-tauri/src/transport.rs.
# [transport]
# provider = "tcl"
# stop_name = "Bellecour"
# stop_ids = [12345, 12346]
# lines = ["A", "D"]

# ---------------------------------------------------------------------------
# Notion (official API, internal integration). Token in the keyring as
# notion_token; share the databases with the integration (••• → Connections).
# Database id = the 32 hex chars in the database URL. Property names are case-sensitive.
# Remove the section to hide the card.
[notion.tasks]
database = "00000000000000000000000000000000"
title = "Name"         # title property
subject = "Subject"    # select
date = "Due"           # date
status = "Status"      # status
done_value = "Done"    # status value meaning done (shown struck through)
exam_value = "Exam"    # subject value marking an exam (next exam = its title + countdown)

# Optional health ring: average over the last 7 days of a number/formula
# property, on rows where a select property equals a value.
[notion.health]
database = "00000000000000000000000000000000"
score = "Score"
date = "Date"
filter_property = "Status"
filter_value = "Filled"

# ---------------------------------------------------------------------------
# Mail: one tab per [[mail]] box. Shows mail carrying the `urgent` / `todo`
# Gmail label, or sitting in those IMAP folders (read-only, nothing marked read).
[[mail]]
name = "Gmail"
label = "Gmail inbox"
kind = "gmail"         # OAuth: scripts/setup-secrets.sh then scripts/gmail-auth.py
urgent = "Urgent"      # label names
todo = "To do"

[[mail]]
name = "Work"
label = "Work inbox"
kind = "imap"
host = "imap.example.org"
port = 993             # implicit TLS
secret_prefix = "work" # keyring keys work_user / work_password
urgent = "Urgent"      # folder names (sub-folders: "Parent/Child")
todo = "To do"
open_url = "https://webmail.example.org/"
