[package]
name = "nexus-mobile"
version = "0.1.0"
description = "NEXUS for Android: a read-only summary from nexus-relay"
license = "MIT"
edition = "2021"

[lib]
# Android loads the app as a shared library (cdylib); staticlib/rlib for other targets.
name = "nexus_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
