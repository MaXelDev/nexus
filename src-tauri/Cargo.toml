[package]
name = "nexus"
version = "0.1.0"
description = "Full-screen personal dashboard for Fedora GNOME (Wayland)"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
url = "2"
# Same versions Tauri already links (no extra build): icon theme lookup and mount events.
gtk = "0.18"
gio = "0.18"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
